[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Sona Agents Plane: a control plane for long-lived agents on Pi."

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
control-plane-agent-journal = { path = "crates/agent-journal" }
control-plane-agent-registry = { path = "crates/agent-registry" }
control-plane-agent-runtime = { path = "crates/agent-runtime" }
control-plane-api = { path = "crates/api" }
control-plane-common = { path = "crates/common" }
control-plane-message-broker = { path = "crates/message-broker" }
control-plane-task-manager = { path = "crates/task-manager" }
control-plane-tool-gateway = { path = "crates/tool-gateway" }
flate2 = "1"
http-body-util = "0.1"
jiff = { version = "0.2", features = ["serde"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tokio = "1"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }

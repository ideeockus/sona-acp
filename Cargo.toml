[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Sona Agents Plane: a control plane for long-lived agents on Pi."

[workspace.dependencies]
async-trait = "0.1"
control-plane-common = { path = "crates/common" }
flate2 = "1"
jiff = { version = "0.2", features = ["serde"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = "1"
uuid = { version = "1", features = ["v7", "serde"] }

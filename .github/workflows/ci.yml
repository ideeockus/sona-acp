name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The rust-version from Cargo.toml (D65).
      - name: Install Rust 1.90
        run: |
          rustup toolchain install 1.90 --profile minimal --component rustfmt,clippy
          rustup default 1.90

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The major version of the agent image (D61).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Exactly the lockfile, and no install scripts of dependencies.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
